<footer class="execution-footer">
  <p class="shortcut-hint">Corrección de totales: Ctrl+Shift+E</p>
  <div class="footer-actions">
    <button
      mat-stroked-button
      type="button"
      color="warn"
      [disabled]="!canUndo"
      (click)="undoBallot.emit()"
    >
      Deshacer última papeleta
    </button>
    <button
      mat-raised-button
      type="button"
      color="accent"
      class="confirm-btn"
      [disabled]="!canConfirm"
      (click)="confirmBallot.emit()"
    >
      Confirmar papeleta
    </button>
  </div>
</footer>
