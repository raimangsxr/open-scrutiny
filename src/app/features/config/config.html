<div class="app-page-shell">
  <app-election-header
    title="Configuración"
    description="Defina el proceso electoral antes del día de la votación."
  />

  <div class="app-page-body">
    <mat-card *ngIf="storageError" class="storage-error-banner section-card">
      <mat-card-content>
        <p>{{ storageError }}</p>
        <button mat-stroked-button type="button" color="warn" (click)="clearCorruptData()">
          Descartar datos guardados
        </button>
      </mat-card-content>
    </mat-card>

    <form [formGroup]="configForm" (ngSubmit)="onSubmit()">
      <mat-card class="section-card">
        <mat-card-header>
          <mat-card-title>Información general</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="form-group">
            <label for="logo">Logo del organismo</label>
            <input type="file" id="logo" (change)="onLogoSelected($event)" accept="image/*" />
            <div *ngIf="logoPreview" class="logo-preview">
              <img [src]="logoPreview" alt="Vista previa del logo" />
            </div>
          </div>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Título del proceso electoral</mat-label>
            <input matInput formControlName="title" placeholder="Ej: Elecciones generales 2025" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Descripción</mat-label>
            <textarea
              matInput
              formControlName="description"
              rows="3"
              placeholder="Descripción breve..."
            ></textarea>
          </mat-form-field>
        </mat-card-content>
      </mat-card>

      <mat-card class="section-card">
        <mat-card-header>
          <mat-card-title>Preguntas</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div formArrayName="votingItems">
            <mat-card
              *ngFor="let item of votingItems.controls; let i = index"
              [formGroupName]="i"
              class="voting-item-card"
            >
              <mat-card-header>
                <mat-card-title>Pregunta #{{ i + 1 }}</mat-card-title>
                <button
                  mat-icon-button
                  color="warn"
                  type="button"
                  (click)="removeVotingItem(i)"
                  *ngIf="votingItems.length > 1"
                >
                  <mat-icon>delete</mat-icon>
                </button>
              </mat-card-header>
              <mat-card-content>
                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Enunciado</mat-label>
                  <input matInput formControlName="question" placeholder="Ej: Delegado de clase" />
                </mat-form-field>

                <div class="options-section">
                  <h4>Opciones</h4>
                  <div formArrayName="options">
                    <div
                      *ngFor="let option of getOptions(i).controls; let j = index"
                      [formGroupName]="j"
                      class="option-row"
                    >
                      <mat-form-field appearance="outline" class="option-field">
                        <mat-label>Opción {{ j + 1 }}</mat-label>
                        <input matInput formControlName="label" placeholder="Nombre de la opción" />
                      </mat-form-field>
                      <button
                        mat-icon-button
                        color="warn"
                        type="button"
                        (click)="removeOption(i, j)"
                        *ngIf="getOptions(i).length > 1"
                      >
                        <mat-icon>close</mat-icon>
                      </button>
                    </div>
                  </div>
                  <button mat-stroked-button type="button" (click)="addOption(i)" color="primary">
                    <mat-icon>add</mat-icon>
                    Añadir opción
                  </button>
                </div>
              </mat-card-content>
            </mat-card>
          </div>

          <button mat-raised-button type="button" (click)="addVotingItem()" color="primary" class="add-voting-btn">
            <mat-icon>add</mat-icon>
            Añadir pregunta
          </button>
        </mat-card-content>
      </mat-card>

      <div class="actions">
        <button mat-raised-button type="submit" color="accent" class="submit-btn" [disabled]="!configForm.valid">
          Guardar e ir a ejecución
        </button>
      </div>
    </form>
  </div>
</div>
