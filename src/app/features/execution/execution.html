<div class="storage-error-wrap" *ngIf="storageError">
  <mat-card class="storage-error-card">
    <mat-card-header>
      <mat-card-title>Datos de elección no disponibles</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{ storageError }}</p>
      <button mat-raised-button color="primary" type="button" (click)="reconfigure()">
        Ir a configuración
      </button>
    </mat-card-content>
  </mat-card>
</div>

<div class="execution-shell" *ngIf="config && !storageError">
  <app-election-header
    [title]="config.title"
    [description]="config.description"
    [logoUrl]="config.logoUrl"
  />

  <main class="execution-main">
    <div class="scrutiny-zone">
      <div class="question-grid" *ngFor="let row of questionRows">
        <app-question-column
          *ngFor="let item of row"
          class="grid-cell"
          [item]="item"
          [chartResults]="chartData[item.id]"
          [yAxisTicks]="getYAxisTicks(item.id)"
          [selectedOptionId]="selectedOptionFor(item.id)"
          (optionSelected)="selectOption(item.id, $event)"
        />
      </div>
    </div>
  </main>

  <app-execution-footer
    [canConfirm]="canConfirmBallot"
    [canUndo]="canUndoBallot"
    (confirmBallot)="confirmBallot()"
    (undoBallot)="requestUndo()"
  />
</div>
